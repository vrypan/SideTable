name: Sidetable
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: chat.sidetable.mac
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  ApronCore:
    path: Packages/ApronCore
targets:
  Sidetable:
    type: application
    platform: macOS
    sources: [Sidetable]
    dependencies:
      - package: ApronCore
    info:
      path: Sidetable/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sidetable
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: Sidetable contributors
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sidetable/Resources/Sidetable.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
  SidetableTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SidetableTests]
    dependencies:
      - target: Sidetable
  SidetableUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [SidetableUITests]
    dependencies:
      - target: Sidetable
schemes:
  Sidetable:
    build:
      targets:
        Sidetable: all
    test:
      targets: [SidetableTests, SidetableUITests]
