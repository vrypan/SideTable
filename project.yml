name: Sidetable
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: chat.sidetable.mac
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.7.3
  ApronCore:
    path: Packages/ApronCore
targets:
  Sidetable:
    productName: SideTable
    settings:
      base:
        PRODUCT_NAME: SideTable
        PRODUCT_MODULE_NAME: Sidetable
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/SideTable-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
    type: application
    platform: macOS
    sources:
      - path: Sidetable
        excludes: [Resources/Info.plist]
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    preBuildScripts:
      - name: Derive build version
        script: /usr/bin/python3 "$SRCROOT/scripts/build_version.py" --root "$SRCROOT" --source "$SRCROOT/Sidetable/Resources/Info.plist" --output "$DERIVED_FILE_DIR/SideTable-Info.plist"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/SideTable-Info.plist
    dependencies:
      - package: Sparkle
      - package: ApronCore
      - package: swift-markdown
        product: Markdown
    info:
      path: Sidetable/Resources/Info.plist
      properties:
        CFBundleDisplayName: SideTable
        CFBundleName: SideTable
        CFBundleIconFile: SideTable.icns
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '0.1.0'
        CFBundleURLTypes:
          - CFBundleURLName: chat.sidetable.mac.apron
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [sidetable, apron]
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: SideTable contributors
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Sidetable/Resources/Sidetable.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.files.user-selected.read-write: true
  SidetableTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SidetableTests]
    dependencies:
      - target: Sidetable
  SidetableUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
    sources: [SidetableUITests]
    dependencies:
      - target: Sidetable
schemes:
  Sidetable:
    build:
      targets:
        Sidetable: all
    test:
      environmentVariables:
        SIDETABLE_TESTING: '1'
      targets: [SidetableTests, SidetableUITests]
