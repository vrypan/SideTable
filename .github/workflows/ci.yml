name: Check
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core conformance
        run: make test-core
      - name: Build
        run: make build
      - name: App tests
        run: make test-app
